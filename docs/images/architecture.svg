<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 360" font-family="-apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <rect width="920" height="360" fill="#ffffff"/>
  <text x="460" y="34" text-anchor="middle" font-size="20" font-weight="700" fill="#1a1a1a">Page Priority Intelligence: data flow</text>
  <text x="460" y="56" text-anchor="middle" font-size="13" fill="#666">Local-first. CSV in, scored prioritization out. Nothing stored.</text>

  <!-- Sources -->
  <g>
    <rect x="30" y="92" width="170" height="176" rx="10" fill="#f6f8fa" stroke="#e2e6ea"/>
    <text x="115" y="114" text-anchor="middle" font-size="13" font-weight="700" fill="#1a1a1a">CSV exports</text>
    <text x="115" y="140" text-anchor="middle" font-size="12" fill="#444">Screaming Frog</text>
    <text x="115" y="160" text-anchor="middle" font-size="12" fill="#444">Search Console</text>
    <text x="115" y="180" text-anchor="middle" font-size="12" fill="#444">GA4</text>
    <text x="115" y="200" text-anchor="middle" font-size="12" fill="#444">PageSpeed</text>
    <text x="115" y="220" text-anchor="middle" font-size="12" fill="#444">URL Inspection</text>
    <text x="115" y="240" text-anchor="middle" font-size="12" fill="#444">Backlinks</text>
  </g>

  <!-- Normalize/join -->
  <rect x="250" y="120" width="160" height="120" rx="10" fill="#eef4ff" stroke="#cfe0ff"/>
  <text x="330" y="160" text-anchor="middle" font-size="13" font-weight="700" fill="#1a1a1a">Normalize</text>
  <text x="330" y="182" text-anchor="middle" font-size="13" font-weight="700" fill="#1a1a1a">and join</text>
  <text x="330" y="206" text-anchor="middle" font-size="11" fill="#5a6b85">by canonical URL</text>

  <!-- Score -->
  <rect x="460" y="120" width="160" height="120" rx="10" fill="#eef4ff" stroke="#cfe0ff"/>
  <text x="540" y="156" text-anchor="middle" font-size="13" font-weight="700" fill="#1a1a1a">Score</text>
  <text x="540" y="178" text-anchor="middle" font-size="11" fill="#5a6b85">log scale vs P90</text>
  <text x="540" y="196" text-anchor="middle" font-size="11" fill="#5a6b85">6 weighted parts</text>
  <text x="540" y="214" text-anchor="middle" font-size="11" fill="#5a6b85">0 to 100</text>

  <!-- Bucket -->
  <rect x="670" y="120" width="160" height="120" rx="10" fill="#eef4ff" stroke="#cfe0ff"/>
  <text x="750" y="156" text-anchor="middle" font-size="13" font-weight="700" fill="#1a1a1a">Assign bucket</text>
  <text x="750" y="178" text-anchor="middle" font-size="11" fill="#5a6b85">9 action buckets</text>
  <text x="750" y="196" text-anchor="middle" font-size="11" fill="#5a6b85">evidence-cited</text>
  <text x="750" y="214" text-anchor="middle" font-size="11" fill="#5a6b85">confidence level</text>

  <!-- Outputs -->
  <rect x="250" y="282" width="580" height="56" rx="10" fill="#f6f8fa" stroke="#e2e6ea"/>
  <text x="540" y="306" text-anchor="middle" font-size="13" font-weight="700" fill="#1a1a1a">Outputs</text>
  <text x="540" y="326" text-anchor="middle" font-size="12" fill="#444">Master scored CSV  .  Markdown report  .  HTML report  .  optional AI recommendations (JSON)</text>

  <!-- Arrows -->
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="7" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L7,3 L0,6 Z" fill="#9aa7b8"/>
    </marker>
  </defs>
  <line x1="200" y1="180" x2="248" y2="180" stroke="#9aa7b8" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="410" y1="180" x2="458" y2="180" stroke="#9aa7b8" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="620" y1="180" x2="668" y2="180" stroke="#9aa7b8" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="750" y1="240" x2="750" y2="280" stroke="#9aa7b8" stroke-width="2" marker-end="url(#arrow)"/>
</svg>
