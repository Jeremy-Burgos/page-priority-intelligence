[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "page-priority-intelligence"
version = "0.1.0"
description = "Local-first SEO page prioritization tool. CSV-upload MVP."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "pandas>=2.0",
    "numpy>=1.24",
    "pydantic>=2.5",
    "streamlit>=1.30",
]

[project.optional-dependencies]
dev = ["pytest>=7.4"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
# Make the src layout importable during tests without installing the package.
pythonpath = ["src"]
testpaths = ["tests"]
